<form data-submit action="/admin/game/players/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}{{#if online}}<span class="tag ok" style="margin-left:8px">在线 — 金币/元宝实时生效并推送客户端</span>{{/if}}</header>
    <div class="body form">
      <label>账号</label><input class="input" value="{{username}}" disabled>
      <label>昵称</label><input class="input" name="nickname" value="{{nickname}}" maxlength="32">
      <label>职业</label>
      <select class="input" name="job">
        <option value="0" {{job0}}>战士</option>
        <option value="1" {{job1}}>法师</option>
        <option value="2" {{job2}}>道士</option>
      </select>
      <label>等级</label><input class="input" type="number" name="level" value="{{level}}" min="1">
      <label>金币</label><input class="input" type="number" name="gold" value="{{gold}}" min="0">
      <label>元宝</label><input class="input" type="number" name="gems" value="{{gems}}" min="0">
      <label>所在地图</label>
      <select class="input" name="mapId">
        {{#each maps}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>状态</label>
      <select class="input" name="status">
        <option value="1">正常</option>
        <option value="0">封禁</option>
      </select>
      <label>封禁原因</label><input class="input" name="banReason" value="{{banReason}}" placeholder="封禁时必填，登录时会展示给玩家">
    </div>
  </div>
  <div class="card"><div class="toolbar">
    <span class="muted">发奖按表单值与当前值的差量生效；封禁会立即踢下线。</span>
    <span class="sp"></span>
    <button class="btn primary" type="submit">保存</button>
  </div></div>
</form>
