<div class="card">
  <div class="toolbar">
    <b>当前在线 {{count}}</b>
    <span class="muted">数据取自世界内存态，即真实会话数</span>
  </div>
  <form class="toolbar" data-submit action="/admin/game/online/broadcast">
    <input class="input" name="text" placeholder="全服喊话，经聊天通道推送给所有在线玩家" maxlength="200" required>
    <button class="btn sm primary" type="submit">喊话</button>
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:64px">CID</th>
        <th style="width:120px">账号</th>
        <th style="width:100px">昵称</th>
        <th class="num" style="width:56px">等级</th>
        <th style="width:96px">地图</th>
        <th style="width:80px">坐标</th>
        <th style="width:120px">登录时间</th>
        <th style="width:88px">心跳空闲</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{cid}}</td>
        <td>{{username}}</td>
        <td>{{nickname}}</td>
        <td class="num">{{level}}</td>
        <td>{{map}}</td>
        <td class="mono muted">{{pos}}</td>
        <td class="muted">{{loginAt}}</td>
        <td class="muted">{{idle}}</td>
        <td class="ops">
          {{#if canUpdate}}<a href="#" data-post="/admin/game/online/kick" data-args="cid={{cid}}" data-confirm="确定断开该会话吗？">踢下线</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">当前没有在线玩家 — 用游戏客户端连 game 端口即可看到会话出现在这里</div>{{/if}}
</div>
