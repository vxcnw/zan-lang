<div class="card">
  <form class="toolbar" data-search action="/admin/game/drops">
    <select class="input w200" name="mob">
      <option value="0">全部怪物</option>
      {{#each mobs}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
    </select>
    <input class="input w160" type="search" name="kw" value="{{kw}}" placeholder="搜索物品名">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/game/drops" data-load>重置</a>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/game/drops/form" data-dialog>新增掉落</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:150px">怪物</th>
        <th class="ellip">物品</th>
        <th class="num" style="width:110px">概率(万分比)</th>
        <th class="num" style="width:80px">概率</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td class="ellip">{{mob}}</td>
        <td class="ellip">{{item}}</td>
        <td class="num muted">{{rate}}</td>
        <td class="num">{{pct}}</td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/game/drops/form?id={{id}}" data-dialog>编辑</a>{{/if}}
          {{#if canDelete}}<a href="#" data-post="/admin/game/drops/delete" data-args="id={{id}}" data-confirm="删除这条掉落？">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">没有符合条件的掉落</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}&mob={{mobFilter}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}&mob={{mobFilter}}" data-load>下一页</a>{{/if}}
  </div>
</div>
